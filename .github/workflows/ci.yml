name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v9
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --locked python scripts/setup_epubcheck.py
      - run: java -jar tools/epubcheck/target/bookloom/epubcheck.jar --version
      - run: uv run --locked python scripts/doc_length_check.py
      - run: uv run --locked python -m pytest -q
