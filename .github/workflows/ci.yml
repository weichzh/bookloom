name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: "3.12"
      - run: pandoc --version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --locked python scripts/setup_epubcheck.py
      - run: java -jar tools/epubcheck/target/bookloom/epubcheck.jar --version
      - run: uv run --locked python scripts/doc_length_check.py
      - run: uv run --locked python -m pytest -q
